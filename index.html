<html>
    <head>
        <title>My First Website 💫</title>
        <style>
            h1{
                color:#34908B
            }
            button{
                background-color:#9FA1FF;
                color: white; 
                border: none; 
                padding: 10px 20px; 
                border-radius: 10px; 
                cursor: pointer;
            }
            body{
                text-align:center;
                background-color:rgb(255, 133, 187);
            }
            img{
                display: block;
                margin: 20px auto;
                max-width: 300px;
                border-radius: 12px;
                
            }
            .spotify-box{
                background:#FFE5F3;
                border:3px solid #FFB7DA;
                border-radius:20px;
                padding:10px;
                display:inline-block;
            }
            .loser-text{
            color: #021A54; 
            font-size: 24px; 
            font-weight: bold; 
            margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <h1>₊✩‧₊˚౨ৎ˚₊✩‧₊I am cool! ₊✩‧₊˚౨ৎ˚₊✩‧₊ </h1>
        <iframe
        class="spotify-box"
        data-testid="embed-iframe"
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/10JsYPcjhsD9nwTuk51Jtb?utm_source=generator&si=e04963816cf541d0"
        width="350"
        height="352"
        frameborder="0"
        allowfullscreen=""
        alow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy" ></iframe>
        
        <br><br> 


        <button id="mybutton"> pick me choose me </button>
        

        <script>
        const mybutton = document.getElementById("mybutton")
        const img = document.createElement("img")
        const losertext = document.createElement("p")
        img.src = "https://i.pinimg.com/736x/8b/b5/0d/8bb50d19f707284d78cf6bf4bab9dabf.jpg"
        losertext.textContent = "Loser" ; 
        losertext.classList.add("loser-text");

        mybutton.addEventListener("click", () => {
        if (!document.body.contains(img)) {
            document.body.append(img);
            }
        if (!document.body.contains(loserText)) {
            document.body.append(loserText);
            }
        });
        </script>
    </body>
</html>
